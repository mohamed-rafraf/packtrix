name: Feature request
description: Something Packtrix should do, or do differently.
labels: [kind/feature]
body:
  - type: markdown
    attributes:
      value: |
        The [roadmap](https://packtrix.github.io/docs/roadmap/) may already plan it: RPM distros, vendor repositories and bundles are on the way. For a distro or vendor repository in the built-in catalog, use the catalog request instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way. Your setup helps, such as how packages cross the air gap, the distros, and the number of machines.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How Packtrix could solve it, such as a manifest field or a command.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds or other tools you use instead.
