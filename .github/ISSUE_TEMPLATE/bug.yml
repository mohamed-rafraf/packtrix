name: Bug report
description: Something doesn't plan, sync or install as it should.
labels: [kind/bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. For a security vulnerability, don't open an issue: [SECURITY.md](https://github.com/packtrix/packtrix/blob/main/SECURITY.md) says how to report it privately.
  - type: input
    id: version
    attributes:
      label: Packtrix version
      description: The output of `packtrix version`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Manifest
      description: The part of `packtrix.yaml` needed to reproduce it. Leave out credentials and internal URLs.
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: The command you ran, and its full output.
      render: console
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The OS and architecture Packtrix runs on, and the distro of the machines if the problem is on them.
      placeholder: Ubuntu 24.04 on amd64; machines on Debian 12
