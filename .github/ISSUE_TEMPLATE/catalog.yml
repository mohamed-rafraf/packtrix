name: Catalog request
description: A distro or vendor repository for the built-in catalog.
labels: [kind/feature, area/catalog]
body:
  - type: markdown
    attributes:
      value: |
        The catalog takes repositories that meet its [inclusion policy](https://packtrix.github.io/docs/catalog/#inclusion-policy): the vendor's official repository, signed with a key whose fingerprint the vendor publishes, and widely used. Until it's in the catalog, any repository works with `extraRepos` in the manifest: see the [repository object](https://packtrix.github.io/docs/manifest/#repository-object).
  - type: input
    id: name
    attributes:
      label: Distro or repository
      description: The distro and release, or the vendor repository.
      placeholder: rocky-10, or docker
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official repository URL
      description: The vendor's own repository, not a mirror.
      placeholder: https://download.docker.com/linux/ubuntu
    validations:
      required: true
  - type: textarea
    id: key
    attributes:
      label: Signing key
      description: The fingerprint of the key that signs the repository, and the vendor's page that publishes it.
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: Why it's widely used
      description: Who uses it, and for what. Links help.
    validations:
      required: true
  - type: input
    id: architectures
    attributes:
      label: Architectures
      placeholder: amd64, arm64
