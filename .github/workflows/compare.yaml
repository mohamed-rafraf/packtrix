# Compares Packtrix's dependency closures with what apt installs, in clean
# containers of each distro: nightly, on demand, and on pull requests that
# change how packages are read or resolved.
name: compare
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - internal/catalog/**
      - internal/deb/**
      - internal/expand/**
      - internal/plan/**
      - internal/repo/apt/**
      - internal/resolve/**
      - test/e2e/compare_test.go
      - .github/workflows/compare.yaml

permissions:
  contents: read

jobs:
  compare:
    name: compare (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, debian-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make test-e2e E2E_RUN='TestCompare/${{ matrix.distro }}'
