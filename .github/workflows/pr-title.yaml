# Checks that pull request titles follow Conventional Commits: squash merges
# make the title the commit message on main, and release notes group by its
# type. pull_request_target gives the check a token on pull requests from
# forks; it only reads the title, and never checks out their code.
name: pr-title
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: pull-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The types that CONTRIBUTING.md lists.
          types: |
            feat
            fix
            docs
            test
            ci
            build
            refactor
            perf
            chore
            revert
