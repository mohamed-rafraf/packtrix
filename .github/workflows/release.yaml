# Publishes a release for each v* tag, with GoReleaser: archives, checksums,
# SBOMs, a keyless signature of the checksums, and build provenance
# attestations. On pull requests that change the release setup, it builds a
# snapshot instead. See docs/releasing.md.
name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yaml
      - cmd/**
      - internal/version/**

permissions:
  contents: read

jobs:
  snapshot:
    name: pull-release-snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.54.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=sign

      - name: Check the artifacts
        run: |
          for platform in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            archive=$(ls dist/packtrix_*_"$platform".tar.gz)
            test -s "$archive.sbom.json"
            grep -q " $(basename "$archive")\$" dist/checksums.txt
          done
          dist/packtrix_linux_amd64_v1/packtrix version

  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub release
      id-token: write # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.54.0

      # The release notes cover everything since the previous release, not
      # since its release candidates; the first release's, since the first
      # commit.
      - name: previous release
        id: previous
        run: |
          previous=$(git describe --tags --abbrev=0 --exclude='*-*' HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "ref=$previous" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.previous.outputs.ref }}

      # Every file that checksums.txt lists: the archives and their SBOMs.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
