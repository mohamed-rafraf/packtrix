name: ubuntu-22.04
family: ubuntu
format: apt
release:
  version: "22.04"
  codename: jammy
architectures: [amd64, arm64]
components:
  - name: main
    default: true
  # Many common server packages are in universe.
  - name: universe
    default: true
  - name: restricted
  - name: multiverse
repositories:
  - name: release
    url: https://archive.ubuntu.com/ubuntu/
    archURLs:
      arm64: https://ports.ubuntu.com/ubuntu-ports/
    suite: jammy
    keys: [ubuntu-archive-2018]
  - name: updates
    url: https://archive.ubuntu.com/ubuntu/
    archURLs:
      arm64: https://ports.ubuntu.com/ubuntu-ports/
    suite: jammy-updates
    keys: [ubuntu-archive-2018]
  - name: security
    url: https://security.ubuntu.com/ubuntu/
    archURLs:
      arm64: https://ports.ubuntu.com/ubuntu-ports/
    suite: jammy-security
    keys: [ubuntu-archive-2018]
baseline:
  repository: release
  component: main
keys:
  # From the ubuntu-keyring package; also on keyserver.ubuntu.com.
  ubuntu-archive-2018: F6EC B376 2474 EDA9 D21B  7022 8719 20D1 991B C93C
