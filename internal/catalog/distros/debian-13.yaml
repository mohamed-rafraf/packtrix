name: debian-13
family: debian
format: apt
release:
  version: "13"
  codename: trixie
architectures: [amd64, arm64]
components:
  - name: main
    default: true
  - name: contrib
  - name: non-free
  - name: non-free-firmware
repositories:
  - name: release
    url: https://deb.debian.org/debian/
    suite: trixie
    keys: [debian-archive-13]
  - name: updates
    url: https://deb.debian.org/debian/
    suite: trixie-updates
    keys: [debian-archive-13]
  - name: security
    url: https://security.debian.org/debian-security/
    suite: trixie-security
    keys: [debian-archive-13-security]
baseline:
  repository: release
  component: main
keys:
  # Published on https://ftp-master.debian.org/keys.html.
  debian-archive-13: 04B5 4C3C DCA7 9751 B16B  C6B5 2256 29DF 75B1 88BD
  debian-archive-13-security: 5E04 A1E3 223A 19A2 0706  E20F 9904 613D 4CCE 68C6
