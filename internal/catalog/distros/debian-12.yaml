name: debian-12
family: debian
format: apt
release:
  version: "12"
  codename: bookworm
architectures: [amd64, arm64]
components:
  - name: main
    default: true
  - name: contrib
  - name: non-free
  - name: non-free-firmware
repositories:
  - name: release
    url: https://deb.debian.org/debian/
    suite: bookworm
    keys: [debian-archive-12]
  - name: updates
    url: https://deb.debian.org/debian/
    suite: bookworm-updates
    keys: [debian-archive-12]
  - name: security
    url: https://security.debian.org/debian-security/
    suite: bookworm-security
    keys: [debian-archive-12-security]
baseline:
  repository: release
  component: main
keys:
  # Published on https://ftp-master.debian.org/keys.html.
  debian-archive-12: B8B8 0B5B 623E AB6A D877  5C45 B7C5 D7D6 3509 47F8
  debian-archive-12-security: 05AB 9034 0C0C 5E79 7F44  A8C8 254C F3B5 AEC0 A8F0
